<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Menma JeM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    header {
      padding: 70px 20px;
      text-align: center;
      background: linear-gradient(135deg, #1e293b, #020617);
    }

    header h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      opacity: 0.8;
    }

    section {
      max-width: 900px;
      margin: auto;
      padding: 60px 20px;
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 20px;
    }

    .card {
      background: #020617;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #020617;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<header>
  <h1>Menma JeM</h1>
  <p>Criação • Design • Projetos Criativos</p>
</header>

<section>
  <h2>Sobre</h2>
  <div class="card">
    <p>
      Este é meu site pessoal, criado com GitHub Pages.
      Aqui compartilho projetos, ideias e trabalhos criativos.
    </p>
  </div>

  <h2>Projetos</h2>
  <div class="card">Projeto em desenvolvimento</div>
  <div class="card">Em breve</div>

  <h2>Contato</h2>
  <div class="card">
    📧 seuemail@email.com<br>
    🌐 GitHub: github.com/MenmaJeM
  </div>
</section>

<footer>
  © 2026 — Menma JeM
</footer>

</body>
</html>
